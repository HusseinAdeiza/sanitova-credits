[toolchain]

[features]
resolution = true
skip-lint = false
# VerifierRouter embeds groth_16_verifier::Proof, so the router's IDL build
# needs idl-build propagated onto that dependency or Anchor cannot expand the
# type into the IDL.
idl-build = ["verifier_router/idl-build", "groth_16_verifier/idl-build"]

# These must match the declare_id! literals in each program's src/lib.rs.
# Anchor's [programs.*] section OVERRIDES declare_id! at build time, so an
# entry left at the upstream value silently compiles the old ID into the
# binary even after the Rust source is edited. Keep these in sync with
# scripts/program-ids.ts.
[programs.localnet]
groth_16_verifier = "THq1qFYQoh7zgcjXoMXduDBqiZRCPeg3PvvMbrVQUge"
verifier_router = "6JvFfBrvCcWgANKh1Eae9xDq4RC6cfJuBcf71rp2k9Y7"

[programs.devnet]
groth_16_verifier = "2iPoTWMXWJ6inLnBeGEZyiKkwEzaQvCX24Cp82UcWm8K"
verifier_router = "5n8zx79RUHafwSSB4vRU5ao9atHzJQHTdJR9ty8YrVte"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
accept = "yarn run ts-node scripts/acceptOwnership.ts"
add = "yarn run ts-node scripts/addVerifier.ts"
client = "yarn run ts-node scripts/codma.ts"
deploy = "yarn run ts-node scripts/deploy.ts"
estop = "yarn run ts-node scripts/estop.ts"
renounce = "yarn run ts-node scripts/renounceOwnership.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
transfer = "yarn run ts-node scripts/transferOwnership.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = true
