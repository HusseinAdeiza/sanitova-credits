[workspace]
# test_bad_verifier is excluded deliberately: it consumes
# groth_16_verifier::Proof without propagating the idl-build feature, so
# building its IDL fails with "no associated function insert_types" and takes
# the whole workspace's `anchor build` down with it. DeathClock never calls it.
members = [
    "programs/groth_16_verifier",
    "programs/verifier_router",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

