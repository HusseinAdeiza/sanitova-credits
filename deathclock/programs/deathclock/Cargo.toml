[package]
name = "deathclock"
version = "0.1.0"
description = "DeathClock Solana inheritance vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deathclock"

[features]
default = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.32.2"
verifier_router = { path = "../../vendor/risc0-solana/solana-verifier/programs/verifier_router", features = ["cpi"] }
sha2 = "0.10"
