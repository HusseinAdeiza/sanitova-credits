[package]
name = "deathclock-zk"
version = "0.1.0"
edition = "2021"
description = "RISC Zero heartbeat prover for DeathClock"
license = "MIT"

[dependencies]
deathclock-zk-methods = { path = "methods" }
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["prove", "std"] }
risc0-groth16 = { version = "3.0.5", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
