[package]
name = "deathclock-zk-guest"
version = "0.1.0"
edition = "2021"

# The guest is built for the zkVM target by risc0-build, which uses
# `riscv32im-risc0-zkvm-elf`; it must not join the host workspace.
[workspace]

[dependencies]
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std"] }
# `default-features = false` is required: sha2's default `std` feature links the
# host std, which collides with the zkVM's own panic handler at link time.
sha2 = { version = "0.10", default-features = false }
